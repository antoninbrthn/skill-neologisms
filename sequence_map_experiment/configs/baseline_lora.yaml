pretrained:
  checkpoint: "antoninbrthn/skill-neologisms-qwen2.5-digitseq-base"

model:
  name: "Qwen/Qwen2.5-0.5B"

dataset:
  skill_op: "[SHIFT_RIGHT]"
  test_op: "[ADD]"
  num_samples: 100000
  val_dataset_size: 1000
  test_dataset_size: 200
  seq_length: 9
  seq_len_min: 2
  reject_len: [5, 7, 9]
  min_ops: 1
  max_ops: 3

peft:
  type: "lora"
  checkpoint_path: null
  params:
    r: 16
    lora_alpha: 16
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
    lora_dropout: 0.1
    bias: "none"

wandb:
  enabled: true
  project: "skill-neologisms"
  tags: ["baseline", "lora"]

training:
  max_length: 512
  max_new_tokens: 10

trainer_args:
  num_train_epochs: 3
  learning_rate: 1e-4
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  logging_strategy: "steps"
  eval_strategy: "steps"
  warmup_steps: 500
  save_steps: 500
  eval_steps: 500
  logging_steps: 100
  do_eval: true
  logging_dir: "./logs"
  eval_on_start: true

output:
  save_dir: "baseline_lora"
  save_history: true
