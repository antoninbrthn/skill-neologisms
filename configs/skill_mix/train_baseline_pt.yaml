defaults:
  - _self_
  - dataset: main/stat_syllogism

model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  type: "hf"

skill:
  name: "PREFIX"
  length: 20
  init_method: "rand"
  checkpoint_path: null

training:
  dataset_path: ${dataset.dataset_path}
  col_prompt: ${dataset.col_prompt}
  col_completion: ${dataset.col_completion}
  val_fraction: 0.1
  skill_save_strategy: "epoch"
  skill_save_steps: 500

trainer_args:
  num_train_epochs: 10
  learning_rate: 5e-3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  logging_strategy: "steps"
  eval_strategy: "steps"
  eval_steps: 10
  logging_steps: 2
  eval_on_start: false
  do_eval: true
  lr_scheduler_type: "linear"
  logging_dir: "./logs"

output:
  dir: null

wandb:
  enabled: true
  tags: ["baseline", "pt_skillmodel"]
  notes: ""
  project: "skill-neologisms-skillmix"
