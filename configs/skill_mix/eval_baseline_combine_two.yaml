model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  type: "peft"
  peft_adapter_path: "REQUIRED_SET_PEFT_ADAPTER_PATH"

generation:
  max_new_tokens: 512
  temperature: 1.0
  do_sample: true
  batch_size: 32
  prompt_version: "default"

skill_mix:
  k: 2
  num_combinations: 50
  num_topics: 1
  fix_topics: false
  seed: 42
  skills_csv: null
  topics_txt: "src/skill_mix/topics_test.txt"
  use_specific_skills: true
  new_skills: ["statistical syllogism", "modus ponens"]
  exclude_skills: ["complex question (loaded question with implicit assumption )", "accident (fallacy)"]

grading:
  enabled: true
  grader_model: "gpt-5"
  prompt_version: "gpt"
  use_batch: true
  batch_size: 32

output:
  dir: null

wandb:
  enabled: true
  tags: ["eval_baseline_combine_two"]
  notes: ""
  project: "skill-neologisms-skillmix"
