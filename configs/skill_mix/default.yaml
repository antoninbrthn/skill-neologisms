  enabled: true
  grader_model: "gpt-5"
  prompt_version: "gpt"
  use_batch: true
  batch_size: 32
  max_tokens: 4096

output:
  dir: null

wandb:
  enabled: true
  tags: []
  notes: ""
  project: "skill-neologisms-skillmix"
